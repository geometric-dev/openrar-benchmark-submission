name = "openrar-benchmark-submission"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
GITHUB_REPO = "geometric-dev/openrar"
GITHUB_TARGET_BRANCH = "v2"

# Cloudflare D1 relational SQLite database binding
# To create database: npx wrangler d1 create openrar-benchmarks
# Replace database_id with your real D1 database UUID after running create
[[d1_databases]]
binding = "DB"
database_name = "openrar-benchmarks"
database_id = "openrar-benchmarks-d1-placeholder"

# Daily cron trigger to execute sync routines / health checks
[triggers]
crons = ["0 0 * * *"]

